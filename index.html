<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>for you</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%231d1533'/%3E%3Cpath d='M58 20a32 32 0 1 0 22 30 24 24 0 0 1-22-30z' fill='%23cba35c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Outfit:wght@400;500&family=Parisienne&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">

<div class="starfield" id="starfield"></div>
<div id="nav-placeholder"></div>

<main class="page greeting-wrap">

  <div class="greeting-intro">
    <p class="eyebrow" id="eyebrowDisplay">for</p>
    <h1 class="her-name" id="herNameDisplay">Her Name</h1>
    <p class="tagline" id="taglineDisplay">a pocket universe, just for you</p>
  </div>

  <div class="seal-stage" id="sealStage">
    <button class="seal-btn" id="openBtn" aria-expanded="false" aria-label="Open your birthday message">
      <span class="seal">
        <svg viewBox="0 0 100 100">
          <circle class="dial-ring" cx="50" cy="50" r="45"></circle>
          <g class="dial-ticks">
            <line x1="50" y1="5" x2="50" y2="15"></line>
            <line x1="72.5" y1="11" x2="69.5" y2="16.2"></line>
            <line x1="89" y1="27.5" x2="83.8" y2="30.5"></line>
            <line x1="95" y1="50" x2="85" y2="50"></line>
            <line x1="89" y1="72.5" x2="83.8" y2="69.5"></line>
            <line x1="72.5" y1="89" x2="69.5" y2="83.8"></line>
            <line x1="50" y1="95" x2="50" y2="85"></line>
            <line x1="27.5" y1="89" x2="30.5" y2="83.8"></line>
            <line x1="11" y1="72.5" x2="16.2" y2="69.5"></line>
            <line x1="5" y1="50" x2="15" y2="50"></line>
            <line x1="11" y1="27.5" x2="16.2" y2="30.5"></line>
            <line x1="27.5" y1="11" x2="30.5" y2="16.2"></line>
          </g>
          <g class="dial-core">
            <circle cx="50" cy="50" r="27"></circle>
            <path class="dial-mark" d="M50,39 L52.5,47.5 L61,50 L52.5,52.5 L50,61 L47.5,52.5 L39,50 L47.5,47.5 Z"></path>
          </g>
        </svg>
      </span>
      <span class="seal-label" id="openLabelDisplay">tap the seal to open</span>
    </button>
  </div>

  <div class="message-panel" id="messagePanel">
    <h2>Happy birthday</h2>
    <p class="body-text" id="greetingMessage"></p>
    <p class="signature" id="yourNameDisplay"></p>
    <a class="enter-link" href="main.html">
      <span id="enterLabelDisplay">step inside</span>
      <svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"></path></svg>
    </a>
  </div>

</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/main.js"></script>
<script>
  ensureSiteAccess();
  buildStarfield("starfield", 55);
  injectNav("home");
  initGreetingPage();
</script>
</body>
</html>
